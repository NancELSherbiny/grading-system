# Everything:   docker compose up --build    -> app http://localhost:4200, Swagger http://localhost:5080/swagger
# Database only (for running the API and Angular yourself):   docker compose up -d --wait db
services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # SQL Server is published for x86-64 only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "GradingSystem#Dev2026"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    # "Healthy" once a login and a query succeed.
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: API/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=GradingSystemDb;User Id=sa;Password=GradingSystem#Dev2026;TrustServerCertificate=True"
      SeedDemoData: "true"
    ports:
      - "5080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver-data:
