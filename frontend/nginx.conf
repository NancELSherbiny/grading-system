server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # API calls go to the API container, so the browser only ever talks to one address.
  location /api/ {
    proxy_pass http://api:8080;
  }

  # Angular handles /students and /grading itself, so every other path serves index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
